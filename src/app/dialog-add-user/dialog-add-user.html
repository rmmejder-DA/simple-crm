<h2 mat-dialog-title>Add User</h2>
<mat-dialog-content>
    <div>
        <mat-form-field class="mr-16" appearance="outline">
            <mat-label>first name</mat-label>
            <input [(ngModel)]="user.firstName" matInput placeholder="Placeholder">
            <mat-hint>please enter your first name</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>last name</mat-label>
            <input [(ngModel)]="user.lastName" matInput placeholder="Placeholder">
            <mat-hint>please enter your last name</mat-hint>
        </mat-form-field>
    </div>

    <div>
        <mat-form-field class="full-width" appearance="outline">
            <mat-label>Birth date</mat-label>
            <input [(ngModel)]="user.birthDate" matInput [matDatepicker]="picker">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </div>

    <div>
        <mat-form-field class="full-width" appearance="outline">
            <mat-label>Address</mat-label>
            <input [(ngModel)]="user.address" matInput placeholder="Placeholder">
            <mat-hint>please enter your Street address</mat-hint>
        </mat-form-field>
    </div>
    <div class="margin-top-16">
        <mat-form-field class="mr-16" appearance="outline">
            <mat-label>Zip Code</mat-label>
            <input [(ngModel)]="user.zipCode" matInput placeholder="Placeholder">
            <mat-hint>please enter your Zip Code</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>City</mat-label>
            <input [(ngModel)]="user.city" matInput placeholder="Placeholder">
            <mat-hint>please enter your City</mat-hint>
        </mat-form-field>
    </div>

</mat-dialog-content>

<mat-dialog-actions>
    <button matButton="tonal" mat-dialog-close>Cancel</button>
    <button matButton="tonal" mat-dialog-close cdkFocusInitial>Save</button>
</mat-dialog-actions>
