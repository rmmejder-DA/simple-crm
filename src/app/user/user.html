<button (click)="addUser()" mat-fab class="add-user-button" color="primary" matTooltip="Add user"
    [matTooltipPosition]="'above'" matTooltipHideDelay="100">
    <span class="material-icons" aria-hidden="true">add</span>
</button>

<mat-card appearance="outlined">
    <table class="mat-elevation-z8">
        <tr>
            <th>Name</th>
            <th>E-mail</th>
            <th>City</th>
        </tr>
        <tr *ngFor="let user of allUsers; trackBy: trackByUserId" [routerLink]="'/user/' + user.id">
            <td>{{ user.firstName }} {{ user.lastName }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.city }}</td>
        </tr>
    </table>
        
</mat-card>
