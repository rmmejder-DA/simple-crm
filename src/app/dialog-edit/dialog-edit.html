<h2 mat-dialog-title>Edit User</h2>
<mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

<mat-dialog-content>
    <div>
        <mat-form-field class="mr-16" appearance="outline">
            <mat-label>First Name</mat-label>
            <input [disabled]="isLoading" [(ngModel)]="user.firstName" matInput placeholder="first-name">
            <mat-hint>Please enter your first name</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input [disabled]="isLoading" [(ngModel)]="user.lastName" matInput placeholder="last-name">
            <mat-hint>Please enter your last name</mat-hint>
        </mat-form-field>
    </div>
        <div>
        <mat-form-field class="full-width" appearance="outline">
            <mat-label>Email</mat-label>
            <input [disabled]="isLoading" [(ngModel)]="user.email" matInput placeholder="email">
        </mat-form-field>
    </div>
    <div>
        <mat-form-field class="full-width" appearance="outline">
            <mat-label>Birth Date</mat-label>
            <input [disabled]="isLoading" [(ngModel)]="birthDate" matInput [matDatepicker]="picker">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </div>

    <div>
        <mat-form-field class="full-width" appearance="outline">
            <mat-label>Address</mat-label>
            <input [disabled]="isLoading" [(ngModel)]="user.address" matInput placeholder="address">
            <mat-hint>Please enter your street address</mat-hint>
        </mat-form-field>
    </div>
    <div class="margin-top-16">
        <mat-form-field class="mr-16" appearance="outline">
            <mat-label>Zip Code</mat-label>
            <input [disabled]="isLoading" [(ngModel)]="user.zipCode" matInput placeholder="zip-code">
            <mat-hint>Please enter your zip code</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>City</mat-label>
            <input [disabled]="isLoading"   [(ngModel)]="user.city" matInput placeholder="city">
            <mat-hint>Please enter your city</mat-hint>
        </mat-form-field>
    </div>

</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-button color="primary" (click)="save()" cdkFocusInitial>Save</button>
</mat-dialog-actions>
