<mat-drawer-container class="mat-drawer-container">
  <mat-drawer #drawer class="sidenav" [opened]="true" mode="side">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo">
    </div>
    <ul class="menu-items">
      <li routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>Dashboard
      </li>
      <li routerLink="/user" routerLinkActive="active">
        <mat-icon>account_circle</mat-icon>User
      </li>
    </ul>
  </mat-drawer>

  <div class="example-sidenav-content">
    <mat-toolbar color="primary">
      <mat-toolbar-row>
        <mat-icon class="menu-icon" (click)="drawer.toggle()">menu</mat-icon>
        <span>Simple CRM</span>
      </mat-toolbar-row>
    </mat-toolbar>
    <div class="router-container"><router-outlet></router-outlet></div>
    
  </div>

</mat-drawer-container>
